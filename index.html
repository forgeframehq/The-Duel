<!doctype html>
<html lang="en">
<head>
<!-- The Duel. Copyright (c) 2026 Sudhi and Forgeframe. All rights reserved. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Duel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<!-- Studio splash: shown once per launch, about two seconds, tap to skip. Same as Dawn of Dynasties. -->
<div id="studio" onclick="this.classList.add('out')">
  <div class="glow"><img src="assets/ui/studio_logo.png" alt="Forge Frame" decoding="async"></div>
  <p>presents</p>
</div>
<script>
  (function () {
    var s = document.getElementById('studio');
    var gone = function () { if (s && s.parentNode) s.parentNode.removeChild(s); };
    s.addEventListener('transitionend', function (e) { if (e.target === s && s.classList.contains('out')) gone(); });
    var t0 = Date.now(), out = function () { requestAnimationFrame(function () { requestAnimationFrame(function () { s.classList.add('out'); setTimeout(gone, 1200); }); }); };
    window.addEventListener('load', function () { setTimeout(out, Math.max(300, 2000 - (Date.now() - t0))); });
    setTimeout(out, 8000);
  })();
</script>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="labels"></div>

<div id="hud" class="hidden">
  <div class="side you">
    <div class="row"><span class="name" id="you-name">YOU</span><span class="pips" id="pips0"></span></div>
    <div class="hp"><b id="ghost0"></b><i id="hp0"></i></div>
    <div class="st"><i id="st0"></i></div>
  </div>
  <div id="clock"><span id="timer">99</span><small id="round">ROUND 1</small></div>
  <div class="side foe">
    <div class="row"><span class="pips" id="pips1"></span><span class="name" id="foe-name">RIVAL</span></div>
    <div class="hp"><b id="ghost1"></b><i id="hp1"></i></div>
    <div class="st"><i id="st1"></i></div>
  </div>
</div>

<div id="banner"><div id="banner-main"></div><div id="banner-sub"></div></div>

<div id="touch"></div>
<div id="controls" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="btn-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.500 5H17v14h-3.500z"/></svg></button>
  <button id="btn-lock" class="btn" aria-label="Lock on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.500" fill="none" stroke-width="2"/><path d="M12 1.500v5M12 17.500v5M1.500 12h5M17.500 12h5" fill="none" stroke-width="2"/></svg><span>LOCK</span></button>
  <button id="btn-heavy" class="btn" aria-label="Heavy attack"><svg viewBox="0 0 24 24"><path d="M12 2l2.800 6.200L21.500 9l-5 4.600 1.400 6.700L12 17l-5.900 3.300 1.400-6.700-5-4.600 6.700-.8z"/></svg><span>HEAVY</span></button>
  <button id="btn-dodge" class="btn" aria-label="Dodge"><svg viewBox="0 0 24 24"><path d="M4 12h11M11 6.500l6 5.500-6 5.500" fill="none" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.500 5v14" fill="none" stroke-width="2.200" stroke-linecap="round"/></svg><span>DODGE</span></button>
  <button id="btn-block" class="btn" aria-label="Block"><svg viewBox="0 0 24 24"><path d="M12 2.500l8 3v6c0 5-3.400 8.600-8 10-4.600-1.400-8-5-8-10v-6z"/></svg><span>BLOCK</span></button>
  <button id="btn-attack" class="btn" aria-label="Attack"><svg viewBox="0 0 24 24"><path d="M20.500 2.500l-1 5.200-9.300 9.300-3.200-3.200 9.300-9.300zM6.200 14.600l3.200 3.200-1.600 1.600-1.200-.4-2 2-1.600-1.600 2-2-.4-1.200z"/></svg><span>ATTACK</span></button>
</div>

<div id="menu">
  <div class="panel">
    <div id="menu-kicker">A one-on-one fight to the last blow</div>
    <img id="menu-logo" src="assets/ui/logo.webp" alt="The Duel">
    <h1 id="menu-title"></h1>
    <div id="menu-result"></div>
    <button id="start">FIGHT</button>
    <button id="change" class="ghost hidden">Change fighters</button>
    <p id="hint">Left thumb moves. Drag the right side to look. Block just before a hit lands to parry. Strike from behind for extra damage.</p>
    <div class="studio-credit"><img src="assets/ui/studio_mark.png" alt=""><span>A Forge Frame game</span></div>
  </div>
</div>

<!-- Character select -->
<div id="select" class="hidden">
  <header>
    <button id="sel-back" class="back" aria-label="Back">‹</button>
    <h2 id="sel-title">Choose your fighter</h2>
    <div class="tabs" role="group" aria-label="Side"><button data-side="you" class="on">You</button><button data-side="rival">Rival</button></div>
  </header>
  <div class="sel-body">
    <div id="roster"></div>
    <aside id="detail">
      <div class="d-top">
        <img id="d-portrait" alt="">
        <div class="d-text"><small id="d-origin"></small><h3 id="d-name"></h3><p id="d-blurb"></p></div>
      </div>
      <div id="d-stats"></div>
      <div class="levels" role="group" aria-label="Difficulty">
        <button data-level="easy">Squire</button>
        <button data-level="normal" class="on">Knight</button>
        <button data-level="hard">Champion</button>
      </div>
      <button id="go">TO BATTLE</button>
    </aside>
  </div>
</div>

<div id="paused" class="hidden"><div>PAUSED<small>Tap to resume</small></div></div>
<div id="rotate"><div><svg viewBox="0 0 48 48"><rect x="15" y="6" width="18" height="36" rx="3" fill="none" stroke-width="2.500"/><path d="M38 30a14 14 0 0 1-10 12M40 24l-2 6-6-2" fill="none" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/></svg>Turn your phone sideways</div></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
