<!doctype html><meta charset="utf-8"><title>Clip viewer</title>
<style>body{margin:0;background:#333}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<canvas id="c" width="320" height="320"></canvas>
<script type="module">
// Dev tool: poses a character at a given time in a clip so screenshots can be taken.
import * as THREE from 'three';
import { loadCharacter, loadClips } from '../src/models.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(2, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(4, 8, 0x888888, 0x555555); scene.add(grid);
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
const model = await loadCharacter(q.get('model') || 'franks_knight');
const clips = await loadClips();
scene.add(model);
const mixer = new THREE.AnimationMixer(model);
let action = null;
const hand = new THREE.Vector3(), bones = {};
model.traverse((o) => { if (o.isBone) bones[o.name] = o; });
window.clipNames = () => [...clips.entries()].map(([n, c]) => [n, +c.duration.toFixed(2)]);
window.show = (name, t, view = 'front') => {
  if (action) action.stop();
  action = mixer.clipAction(clips.get(name)); action.play(); action.paused = true; action.time = t; mixer.update(0);
  if (view === 'front') cam.position.set(-1.6, 1.5, 4.2); else if (view === 'side') cam.position.set(-4.4, 1.3, 0.3); else cam.position.set(0.5, 1.6, -4.3);
  cam.lookAt(0, 0.95, 0); renderer.render(scene, cam);
};
// Speed and reach of a bone over a clip, for finding where a swing lands.
window.trace = (name, bone = 'RightHand', step = 1 / 30) => {
  const clip = clips.get(name), out = []; let prev = null;
  if (action) action.stop();
  action = mixer.clipAction(clip); action.play(); action.paused = true;
  for (let t = 0; t <= clip.duration; t += step) {
    action.time = t; mixer.update(0); model.updateMatrixWorld(true); bones[bone].getWorldPosition(hand);
    out.push([+t.toFixed(2), prev ? +(hand.distanceTo(prev) / step).toFixed(1) : 0, +hand.z.toFixed(2), +hand.y.toFixed(2)]);
    prev = hand.clone();
  }
  return out;
};
window.info = () => { model.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(model); const o = {}; for (const n of ['RightHand', 'LeftForeArm', 'LeftHand', 'Head']) { bones[n].getWorldPosition(hand); o[n] = hand.toArray().map((v) => +v.toFixed(2)); } return { box: [b.min.toArray(), b.max.toArray()], o }; };
// World direction of a bone's local axes (x = right of screen is -X of a +Z-facing model).
window.axes = (bone) => { model.updateMatrixWorld(true); const q = new THREE.Quaternion(); bones[bone].getWorldQuaternion(q); const f = (v) => v.applyQuaternion(q).toArray().map((n) => +n.toFixed(1)); return { x: f(new THREE.Vector3(1, 0, 0)), y: f(new THREE.Vector3(0, 1, 0)), z: f(new THREE.Vector3(0, 0, 1)) }; };
window.ready = true;
</script>
